[project]
name = "qubes-clash-gateway"
version = "2.0.0"
description = "Qubes OS transparent proxy gateway using mihomo + nftables"
requires-python = ">=3.8"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.coverage.run]
source = ["clashctl"]
omit = ["clashctl/web.py", "clashctl/web_templates/*", "clashctl/__main__.py", "clashctl/i18n.py", "clashctl/ui.py"]

[tool.coverage.report]
show_missing = true
fail_under = 30
